<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Formatting in <HTML></HTML></title>
</head>
<body>
      <b>Bold Text</b><br>
      <strong>Strong Text</strong><br>
      <i>Italic Text</i><br>
      <em>Emphasized Text</em><br>
      <mark>Mark Text</mark><br>
      <small>Small Text</small><br>
      <del>Delete Text</del><br>
      <ins>Inserted Text</ins><br>
      <u>Underlined Text</u><br>
      <sub>Subscript Text: H<sub>2</sub>O</sub><br>
      <sup>Subscript Text: 2<sup>2</sup>=4</sup><br>
</body>
</html>
