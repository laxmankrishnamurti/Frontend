<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Link and Image Tag</title>
</head>
<body>
      <a href="https://wikipedia.org" target="_blank">Wikipedia</a>
      <a href="https://acharyaprashant.org" target="_blank">Acharya Prashant</a>

      <a href="https://unsplash.com/photos/mount-fuji-and-cosmos-flowers-rj1IGpHcIc0" target="_blank">
            <img src="https://images.unsplash.com/photo-1791313779146-f1b991068700?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="unsplash_mountain_view">
      </a>

      <a href="mailto:laxmankrishnamurti@gmail.com">
            <button>Send an Email To Me!</button>
      </a>

      <a onclick="document.location='https://acharyaprashant.org'" target="_blank">
            <button>Click here!</button>
      </a>

      <!--Image Formats that HTML allows
      
            - Animated Portable Network Graphics (.apng)
            - Graphics Interchange Format (.gif)
            - Microsoft Icon (.ico, .cur)
            - Joint Photographic Expert Group Image (.jpg, jpeg, jfif, pjpeg, pjp)
            - Portable Network Graphics (.png)
            - Scalable Vector Graphics (.svg)
      -->

      <p>
            <img src="https://images.unsplash.com/photo-1791313779146-f1b991068700?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="unsplash_mountain_view" style="float: right; width: 50px; height: 50px;">
            This image will float to the right of the text.
      </p>
      <p>
            <img src="https://images.unsplash.com/photo-1791313779146-f1b991068700?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="unsplash_mountain_view" style="float: left; width: 50px; height: 50px;">
            This image will float to the right of the text.
      </p>
</body>
</html>
