<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Favicon and Page Title</title>

      <!--A favicon is a small image, so it should be a simple image with high contrast.-->
      <link rel="shortcut icon" href="./img/candlestick.png" type="image/x-icon">
</head>
<body>
      <!--The Page title is very important for search engine optimization(SEO). The text is used by search engine algorithms to decide the order when listing page in search results.-->
      <h1>Favicon and Page Title</h1>
</body>
</html>
